{% extends "base.html" %}

{% block title %}Page not found · {{ config.extra.author }}{% endblock title %}

{% block main %}
<section class="container notfound">
    <p class="eyebrow">404</p>
    <h1 class="display-lg">Page not found</h1>
    <p class="deck">That page doesn't exist, or it moved.</p>
    <p><a class="text-link" href="{{ config.base_url ~ '/' }}">Back home <span aria-hidden="true">→</span></a></p>
</section>
{% endblock main %}
